<!doctype html><html><head><meta charset="utf-8"><title>MO Park</title><link rel="stylesheet" href="styles.css"></head><body>
<main>
  <header><div><b>MO</b> PARK</div><span>Layer motion</span></header>
  <div class="tabs main-tabs" id="mainTabs"><button class="active" data-view="create">CREATE</button><button data-view="library">LIBRARY</button></div>
  <div id="createView">
    <section class="preview"><div id="stage"><div id="object"><i></i></div></div></section>
    <div class="tabs" id="phase"><button class="active" data-phase="in">IN</button><button data-phase="out">OUT</button></div>
    <section id="timedControls">
      <label>DIRECTION</label>
      <div class="directions" id="direction">
        <button data-direction="none" title="No position"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="8"/><path d="M9 23 23 9"/></svg></button>
        <button class="active" data-direction="up" title="Up"><svg viewBox="0 0 32 32"><path d="M16 25V7m-7 7 7-7 7 7"/></svg></button>
        <button data-direction="down" title="Down"><svg viewBox="0 0 32 32"><path d="M16 7v18m-7-7 7 7 7-7"/></svg></button>
        <button data-direction="left" title="Left"><svg viewBox="0 0 32 32"><path d="M25 16H7m7-7-7 7 7 7"/></svg></button>
        <button data-direction="right" title="Right"><svg viewBox="0 0 32 32"><path d="M7 16h18m-7-7 7 7-7 7"/></svg></button>
      </div>
      <div class="grid"><label>DISTANCE <output id="distanceOut">100 px</output><input id="distance" type="range" min="0" max="500" step="10" value="100"></label><label>DURATION <output id="durationOut">30 fr</output><input id="duration" type="range" min="10" max="100" step="10" value="30"></label></div>
      <label>EASE <output id="easeOut">100%</output><input id="ease" type="range" min="-100" max="100" value="100"></label>
      <div class="toggles"><label><input id="scaleOn" type="checkbox"><span>SCALE</span></label><label><input id="opacityOn" type="checkbox"><span>OPACITY</span></label></div>
      <label id="scaleRow">SCALE <output id="scaleOut">80%</output><input id="scale" type="range" min="0" max="400" step="5" value="80"></label>
    </section>
    <section><label>ANCHOR POINT</label><div class="anchor-grid" id="anchor"><button data-anchor="0,0"></button><button data-anchor="0.5,0"></button><button data-anchor="1,0"></button><button data-anchor="0,0.5"></button><button class="active" data-anchor="0.5,0.5"></button><button data-anchor="1,0.5"></button><button data-anchor="0,1"></button><button data-anchor="0.5,1"></button><button data-anchor="1,1"></button></div></section>
    <div class="actions"><button id="clean">Clean</button><button id="apply">Apply IN</button></div>
  </div>
  <div id="libraryView">
    <label>NEW PRESET</label>
    <div class="preset-save"><input id="presetName" type="text" maxlength="30" placeholder="Preset name"><button id="saveLayerPreset">Save from Layer</button></div>
    <label>SAVED PRESETS</label><div id="presetLibrary" class="preset-library"></div>
  </div>
  <p id="status">Select one 2D layer in After Effects.</p>
  <footer>By <a id="authorLink" href="https://www.instagram.com/brunojorri_work/">Bruno Jorri</a></footer>
</main><script src="CSInterface.js"></script><script src="app.js"></script></body></html>
